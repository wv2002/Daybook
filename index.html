<style>
  :root {
    --bg: #141414;
    --bg-soft: #1c1c1c;
    --text: #f0f0ee;
    --text-soft: #a0a0a0;
    --text-faint: #4d4d4d;
    --border: #2c2c2c;
    --accent: #f0f0ee;
    --accent-text: #141414;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --bg-soft: #f6f6f4;
    --text: #1a1a1a;
    --text-soft: #6b6b6b;
    --text-faint: #cfcfcf;
    --border: #e3e3e0;
    --accent: #1a1a1a;
    --accent-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 0;
  }
  #themeToggle {
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #themeToggle svg { width: 18px; height: 18px; stroke: var(--text); fill: none; }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-soft);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .tab.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .layout {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .calendar-panel {
    flex: 1 1 300px;
    min-width: 280px;
  }
  .entry-panel {
    flex: 1 1 340px;
    min-width: 280px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .month-nav span {
    font-weight: 500;
    text-transform: capitalize;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 24px;
  }
  .weekday {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    position: relative;
    color: var(--text);
    background: var(--bg-soft);
  }
  .day.future { color: var(--text-faint); }
  .day.empty { visibility: hidden; cursor: default; }
  .day.selected { outline: 2px solid var(--text); }
  .day.in-week:not(.selected) { background: color-mix(in srgb, var(--text) 10%, var(--bg-soft)); }
  .day .dot {
    position: absolute;
    bottom: 5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
  }
  .entry-box {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .entry-box .label {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 10px;
  }
  .entry-box .label.week-labels {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  textarea {
    width: 100%;
    min-height: 260px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .status {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 8px;
    height: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Daybook</h1>
    <button id="themeToggle" aria-label="Alternar tema"></button>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="day">Dia</div>
    <div class="tab" data-mode="week">Semana</div>
  </div>

  <div class="layout">
    <div class="calendar-panel">
      <div class="month-nav">
        <button id="prevMonth">‹</button>
        <span id="monthLabel"></span>
        <button id="nextMonth">›</button>
      </div>
      <div class="grid" id="weekdays"></div>
      <div class="grid" id="calendarGrid"></div>
    </div>

    <div class="entry-panel">
      <div id="dayView">
        <div class="entry-box">
          <div class="label" id="dayLabel"></div>
          <textarea id="dayText" placeholder="Escreva o que passou pela cabeça hoje..."></textarea>
          <div class="status" id="dayStatus"></div>
        </div>
      </div>

      <div id="weekView" style="display:none">
        <div class="entry-box">
          <div class="label week-labels">
            <span id="weekLabelMonth"></span>
            <span id="weekLabelYear"></span>
          </div>
          <textarea id="weekText" placeholder="Anotação livre da semana..."></textarea>
          <div class="status" id="weekStatus"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== CONFIG =====
const API_URL = 'https://script.google.com/macros/s/AKfycbz_6NpqbDHoJwJ8Bj1M6Hj3qGRGPfaOKCKaWpbwLBI2deFp4eQC64UDvSPpM1c5H5au/exec';

// ===== ICONS =====
const moonIcon = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
const sunIcon = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

// ===== THEME =====
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.innerHTML = t === 'dark' ? sunIcon : moonIcon;
  localStorage.setItem('daybook-theme', t);
}
applyTheme(localStorage.getItem('daybook-theme') || 'dark');
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};

// ===== TABS =====
let currentMode = 'day';
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t => t.onclick = () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentMode = t.dataset.mode;
  document.getElementById('dayView').style.display = currentMode === 'day' ? 'block' : 'none';
  document.getElementById('weekView').style.display = currentMode === 'week' ? 'block' : 'none';
  renderCalendar();
});

// ===== HELPERS =====
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function monthKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

function weekInfo(date) {
  const year = date.getFullYear();
  const month = date.getMonth();
  const jan1 = new Date(year, 0, 1);
  const dayOfYear = Math.floor((date - jan1) / 86400000) + 1;
  const weekOfYear = Math.ceil((dayOfYear + jan1.getDay()) / 7);
  const monthStart = new Date(year, month, 1);
  const weekOfMonth = Math.ceil((date.getDate() + monthStart.getDay()) / 7);
  const key = `${year}-W${pad(weekOfYear)}`;
  return { year, month, weekOfYear, weekOfMonth, key };
}
function startOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay());
  d.setHours(0,0,0,0);
  return d;
}
function endOfWeek(date) {
  const d = startOfWeek(date);
  d.setDate(d.getDate() + 6);
  return d;
}

const monthNames = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const weekdayNames = ['D','S','T','Q','Q','S','S'];
const ordinal = n => `${n}ª`;

let viewDate = new Date();
let selectedDate = new Date();
let monthEntries = new Set();

// ===== API =====
async function apiGet(action, params) {
  try {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.entries(params||{}).forEach(([k,v]) => url.searchParams.set(k,v));
    const res = await fetch(url);
    return await res.json();
  } catch (err) {
    console.error('apiGet falhou', err);
    return {};
  }
}
async function apiSave(type, key, text) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type, key, text })
    });
  } catch (err) {
    console.error('apiSave falhou', err);
  }
}

// ===== CALENDAR =====
document.getElementById('weekdays').innerHTML = weekdayNames.map(w => `<div class="weekday">${w}</div>`).join('');

async function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${monthNames[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  const mk = monthKey(viewDate);
  const res = await apiGet('getMonth', { month: mk });
  monthEntries = new Set(res.keys || []);

  const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();

  for (let i=0;i<startOffset;i++) {
    grid.innerHTML += `<div class="day empty"></div>`;
  }

  const today = new Date(); today.setHours(0,0,0,0);
  const weekStart = startOfWeek(selectedDate);
  const weekEnd = endOfWeek(selectedDate);

  for (let d=1; d<=daysInMonth; d++) {
    const thisDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
    const key = dateKey(thisDate);
    const isFuture = thisDate > today;
    const isSelected = dateKey(selectedDate) === key;
    const inWeek = currentMode === 'week' && thisDate >= weekStart && thisDate <= weekEnd;
    const hasEntry = monthEntries.has(key);
    grid.innerHTML += `<div class="day ${isFuture?'future':''} ${isSelected?'selected':''} ${inWeek?'in-week':''}" data-key="${key}">
      ${d}${hasEntry ? '<span class="dot"></span>' : ''}
    </div>`;
  }

  grid.querySelectorAll('.day[data-key]').forEach(el => {
    el.onclick = () => {
      const [y,m,dd] = el.dataset.key.split('-').map(Number);
      selectedDate = new Date(y, m-1, dd);
      renderCalendar();
      if (currentMode === 'day') loadDay();
      else loadWeek();
    };
  });
}

document.getElementById('prevMonth').onclick = () => { viewDate.setMonth(viewDate.getMonth()-1); renderCalendar(); };
document.getElementById('nextMonth').onclick = () => { viewDate.setMonth(viewDate.getMonth()+1); renderCalendar(); };

// ===== DAY ENTRY =====
const dayText = document.getElementById('dayText');
const dayStatus = document.getElementById('dayStatus');
let dayTimer = null;
let currentDayKey = null;

async function loadDay() {
  currentDayKey = dateKey(selectedDate);
  document.getElementById('dayLabel').textContent = selectedDate.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  dayStatus.textContent = 'carregando...';
  const res = await apiGet('getDay', { key: currentDayKey });
  dayText.value = res.text || '';
  dayStatus.textContent = '';
}
dayText.addEventListener('input', () => {
  dayStatus.textContent = 'digitando...';
  clearTimeout(dayTimer);
  dayTimer = setTimeout(async () => {
    await apiSave('day', currentDayKey, dayText.value);
    monthEntries.add(currentDayKey);
    dayStatus.textContent = 'salvo ✓';
    setTimeout(()=> dayStatus.textContent='', 1500);
  }, 1200);
});

// ===== WEEK ENTRY =====
const weekText = document.getElementById('weekText');
const weekStatus = document.getElementById('weekStatus');
let weekTimer = null;
let currentWeekKey = null;

async function loadWeek() {
  const info = weekInfo(selectedDate);
  currentWeekKey = info.key;
  document.getElementById('weekLabelMonth').textContent = `${ordinal(info.weekOfMonth)} semana de ${monthNames[info.month]} de ${info.year}`;
  document.getElementById('weekLabelYear').textContent = `${ordinal(info.weekOfYear)} semana de ${info.year}`;
  const res = await apiGet('getWeek', { key: currentWeekKey });
  weekText.value = res.text || '';
}
weekText.addEventListener('input', () => {
  weekStatus.textContent = 'digitando...';
  clearTimeout(weekTimer);
  weekTimer = setTimeout(async () => {
    await apiSave('week', currentWeekKey, weekText.value);
    weekStatus.textContent = 'salvo ✓';
    setTimeout(()=> weekStatus.textContent='', 1500);
  }, 1200);
});

// ===== INIT =====
(async function init(){
  await renderCalendar();
  await loadDay();
  await loadWeek();
})();
</script>
</body>
</html>
